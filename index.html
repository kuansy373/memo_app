<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マークダウンメモ帳</title>
  <script>
    const t = localStorage.getItem('theme') ?? 'system';
    const resolved = t === 'dark' ? 'dark'
      : t === 'light' ? 'light'
      : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', resolved);
  </script>
  <link rel="stylesheet" href="/memo_app/style.css">
  <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
  <link id="hljs-dark"  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" disabled>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
</head>
<body>

  <header>
    <strong></strong>
    <button id="push-btn" onclick="push()" style="display:none;">Push</button>
    <button id="pull-btn" onclick="pull()" style="display:none;">Pull</button>
    <button id="rename-btn">
      <span class="icon" aria-label="名前変更"></span>
    </button>
  </header>

  <div id="control-row">
    <span id="mode-label">プレビュー中</span>
    <button id="push-diff-btn" onclick="showPushDiff()" style="display:none;">push内容を確認</button>
    <button id="cancel-pull-btn" onclick="cancelPull()" style="display:none;">pullしない</button>
    <button id="pull-diff-btn" onclick="showPullDiff()" style="display:none;">pull内容を確認</button>
    <button class="btn-toggle" onclick="togglePane()" style="display: none;">
      <span class="btn-icon btn-icon--pen" aria-label="編集"></span>
    </button>
  </div>

  <div id="app" class="mode-preview">
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="preview"></div>
  </div>

  <script>
    const redirectPath = sessionStorage.getItem('redirect_path');
    if (redirectPath) {
      sessionStorage.removeItem('redirect_path');
      history.replaceState(null, '', redirectPath);
    }
  </script>

  <script type="module" src="/memo_app/js/ui.js"></script>
</body>
</html>
